[sgfix]
; Refresh rates in order of preference. For every resolution the game is handed the first rate
; from this list that the display supports, so that is what the video-mode menu shows and uses.
; 60 is the safe default (the game was written for 60 Hz). Put 120 or 144 first to try those.
refresh=60,120,144,100,59,50

; 0 = hand the game exactly one refresh rate per resolution (the preferred one) - recommended:
;     the game sorts the rates itself and takes the lowest one it accepts, so it must only see one.
; 1 = also pass the other rates after the preferred one
keep_others=0

; Drop modes smaller than this (0 = keep all)
min_width=0
min_height=0

; Experimental overrides applied to the game's device creation (0 / -1 = off):
;   force_refresh=120     force the fullscreen refresh rate the game asks for
;   present_interval=1    0 = no vsync, 1 = vsync
force_refresh=0
present_interval=-1

; Write sgfix.log next to this file (the real and adjusted mode lists, device creation details)
log=1
; Also copy the game's own debug output (its video-mode decisions) into sgfix.log
capture_debug=1

; Diagnostic: 0 = do not hook anything, only forward calls to the real d3d9.dll
hooks=1

; Render logging: every render-target texture the game creates is logged, and a full description of
; frames dump_frame..dump_frame+dump_count-1 (and of the next frames whenever F9 is pressed) is
; written: render targets, viewports, draws with the texture and filter in use, StretchRects.
log_textures=1
dump_frame=300
dump_count=2

; If a renamed ReShade (default: ReShade32.dll) is next to the game it is loaded before the real
; d3d9.dll so that both can be active (ReShade must not be installed as d3d9.dll itself).
reshade=ReShade32.dll
