[sgfix]
; Refresh rates in order of preference. For every resolution the game is handed the first rate
; from this list that the display supports, so that is what the video-mode menu shows and uses.
; 60 is the safe default (the game was written for 60 Hz). Put 120 or 144 first to try those.
refresh=60,120,144,100,59,50

; 1 = also keep the other refresh rates after the preferred one (safe, recommended)
; 0 = hand the game only one refresh rate per resolution
keep_others=1

; Drop modes smaller than this (0 = keep all)
min_width=0
min_height=0

; Experimental overrides applied to the game's device creation (0 / -1 = off):
;   force_refresh=120     force the fullscreen refresh rate the game asks for
;   present_interval=1    0 = no vsync, 1 = vsync
force_refresh=0
present_interval=-1

; Write sgfix.log next to this file (the real and adjusted mode lists, device creation details)
log=1

; Diagnostic: 0 = do not hook anything, only forward calls to the real d3d9.dll
hooks=1
